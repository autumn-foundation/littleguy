# littleguy in a container (see "Run it in a container" in the README).
#
#   docker compose up -d --build
#   docker compose exec lg lg ui        # a sign-in link for the pages
#   docker compose exec lg lg chat "hi"
#
# The keys come from your shell by name. This file holds no value. With
# the house keys sealed in the volume (`lg keys`), only LG_SAN_MATEO_KEY
# needs to pass.

services:
  # Docker seeds a volume from the image only while the volume is empty.
  # So a volume made by an older image lacks a folder that a newer image
  # adds, and lg cannot make one in the config folder of root (ADR 0032).
  # This service runs as root before each start. It makes the folders that
  # lg writes and gives them to lg. It never touches lg.toml or the config
  # folder itself. `cargo xtask container` checks it on an old volume.
  volume:
    image: littleguy:local
    user: root
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /data/config/littleguy/skills /data/config/littleguy/scripts
        /data/share/littleguy
        && chown -R lg:lg /data/config/littleguy/skills /data/config/littleguy/scripts
        && chown lg:lg /data/share /data/share/littleguy
    volumes:
      - lg-data:/data
    restart: "no"

  lg:
    build: .
    image: littleguy:local
    depends_on:
      volume:
        condition: service_completed_successfully
    command: ["serve", "--model", "${LG_MODEL:-offline}"]
    environment:
      - LG_MODEL_NAME
      - LG_REVIEWER_MODEL_NAME
      - LG_REASONING
      - LG_SAN_MATEO_KEY
      - LG_SAN_MATEO_KEY_ID
      - LG_SAN_MATEO_KEY_RETIRED
      - OPENROUTER_API_KEY
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - LG_BRAVE_API_KEY
      - DISCORD_BOT_TOKEN
      - SLACK_BOT_TOKEN
      - SLACK_APP_TOKEN
    volumes:
      - lg-data:/data
    # The process sandbox runs each run_code call in a new user namespace,
    # and in a network namespace when the code gets no network. The default
    # seccomp profile of Docker blocks that, so every call would fail. The
    # code still runs as lg with no capabilities, and no-new-privileges
    # stops a setuid program from making it root. `cargo xtask container`
    # checks this.
    security_opt:
      - seccomp=unconfined
      - no-new-privileges:true
    # The pages serve on the loopback address of the container only. The
    # forwarder below shares its network, and this port reaches the
    # forwarder from the loopback address of this machine only. A port other
    # than 3004 needs the same port in `[ui] bind` of lg.toml.
    ports:
      - "127.0.0.1:${LG_PAGES_PORT:-3004}:3005"
    restart: unless-stopped

  pages:
    image: littleguy:local
    network_mode: service:lg
    entrypoint: ["socat", "TCP-LISTEN:3005,fork,reuseaddr", "TCP:127.0.0.1:${LG_PAGES_PORT:-3004}"]
    depends_on:
      - lg
    restart: unless-stopped

volumes:
  lg-data:
