[package]
name = "littleguy-channels"
description = "The chat channels of littleguy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
autumn-plugin-discord = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# The fake Discord that the tests of this crate and of the daemon run against.
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.29", optional = true, default-features = false, features = ["handshake"] }

[features]
testing = ["dep:futures-util", "dep:tokio-tungstenite"]

[dev-dependencies]
littleguy-channels = { path = ".", features = ["testing"] }

[lints]
workspace = true
