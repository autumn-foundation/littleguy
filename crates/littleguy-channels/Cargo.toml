[package]
name = "littleguy-channels"
description = "The chat channels of littleguy: Discord and Slack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
autumn-plugin-discord = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = { workspace = true }

[features]
# The fake Discord and the fake Slack that the tests run against.
testing = []

[dev-dependencies]
littleguy-channels = { path = ".", features = ["testing"] }

[lints]
workspace = true
