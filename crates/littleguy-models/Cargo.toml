[package]
name = "littleguy-models"
description = "AgentModel implementations for littleguy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
autumn-harvest-agent = { version = "0.10.0", default-features = false }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }
sha2 = { version = "0.11", optional = true }

[features]
default = ["claude", "openai"]
# Claude over the Messages API, with its turn store.
claude = ["dep:reqwest", "dep:rustls", "dep:sha2"]
# OpenAI, OpenRouter and any Chat Completions server.
openai = ["dep:reqwest", "dep:rustls"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "http_models"
required-features = ["claude", "openai"]

[lints]
workspace = true
