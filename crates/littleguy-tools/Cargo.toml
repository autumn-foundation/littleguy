[package]
name = "littleguy-tools"
description = "The tools of the littleguy assistant: web fetch, web search and workspace files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
autumn-harvest-agent = { version = "0.10.0", default-features = false }
littleguy-core = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }
tokio = { workspace = true }
url = "2"

[dev-dependencies]
axum = "0.8"
proptest = { workspace = true }

[lints]
workspace = true
