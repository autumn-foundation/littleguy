[package]
name = "littleguy"
description = "An always-on personal agent on autumn-harvest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lg"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", optional = true }
autumn-harvest = "0.10"
autumn-harvest-agent = { workspace = true }
autumn-harvest-plugin = { version = "0.10", optional = true, default-features = false, features = ["connectors"] }
autumn-harvest-sqlite = { workspace = true }
autumn-web = { version = "0.10", default-features = false, features = ["maud", "htmx"] }
autumn-plugin-slack = { version = "0.4", optional = true }
form_urlencoded = { version = "1", optional = true }
maud = "0.27"
camel-api = { version = "0.57", optional = true }
chrono = "0.4"
camel-builder = { version = "0.57", optional = true }
camel-component-api = { version = "0.57", optional = true }
camel-component-direct = { version = "0.57", optional = true }
camel-component-file = { version = "0.57", optional = true }
camel-component-timer = { version = "0.57", optional = true }
camel-core = { version = "0.57", optional = true }
harvest-camel = { version = "0.4", optional = true, default-features = false, features = ["sqlite"] }
clap = { workspace = true }
getrandom = "0.4"
littleguy-channels = { workspace = true }
littleguy-core = { workspace = true }
littleguy-models = { workspace = true }
littleguy-stores = { workspace = true }
littleguy-tools = { workspace = true }
rustix = { workspace = true }
san-mateo = { version = "0.1", optional = true }
san-mateo-sqlite = { version = "0.1", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { version = "0.7", optional = true }

[features]
default = ["discord", "slack", "claude", "openai", "web", "mcp", "sandbox", "refine"]
# Every integration.
full = ["default", "camel", "google", "fleet"]
# Discord direct messages over the gateway.
discord = ["littleguy-channels/discord"]
# Slack direct messages over Socket Mode, or over the Events API as a hook.
slack = ["littleguy-channels/slack", "dep:autumn-plugin-slack", "dep:form_urlencoded"]
# `--model claude`: Claude over the Messages API.
claude = ["littleguy-models/claude"]
# `--model openai` and `--model openrouter`.
openai = ["littleguy-models/openai"]
# The `web_fetch` and `web_search` tools.
web = ["littleguy-tools/web"]
# The tools of each `[[mcp.server]]`.
mcp = ["littleguy-tools/mcp"]
# The `run_code` tool and `[sandbox]`.
sandbox = ["autumn-harvest/sandbox-activities", "autumn-harvest-agent/sandbox"]
# `[refine]` and `lg refine`: profile overlays that the model proposes and
# the owner activates. It adds no crate.
refine = []
# `[[camel.route]]`: Apache Camel routes that feed the assistant.
camel = [
    "dep:autumn-harvest-plugin",
    "dep:camel-api",
    "dep:camel-builder",
    "dep:camel-component-api",
    "dep:camel-component-direct",
    "dep:camel-component-file",
    "dep:camel-component-timer",
    "dep:camel-core",
    "dep:harvest-camel",
]
# `[san_mateo]` and `lg connect`: OAuth connections kept by San Mateo.
oauth = ["dep:san-mateo", "dep:san-mateo-sqlite", "dep:axum"]
# `[google]`: the Gmail and Google Calendar tools. Needs `oauth`.
google = ["oauth", "littleguy-tools/google"]
# `[fleet]`: the memory, the episodes and the approvals in a tenant database,
# replicated to a directory or an S3-compatible store by autumn-web. The
# replication of autumn-web needs a database backend, so it takes `postgres`.
fleet = ["autumn-web/postgres", "autumn-web/http-client", "dep:tokio-util"]

[dev-dependencies]
autumn-web = { version = "0.10", default-features = false, features = ["maud", "htmx", "test-support"] }
base64 = "0.23"
reqwest = { version = "0.12", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
littleguy-channels = { workspace = true, features = ["testing"] }
littleguy-tools = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio-util = "0.7"

[lints]
workspace = true
